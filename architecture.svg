<svg width="680" height="740" viewBox="0 0 680 740" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, Helvetica, sans-serif">
<title>NPU top-level architecture</title>
<desc>Block diagram of the systolic-array NPU. Data flows from external DRAM into a DRAM loader, which feeds activation and weight SRAM buffers into a systolic controller and systolic array. The array's partial sums pass through a SIMD gearbox into a SIMD vector unit, controlled by an opcode input, for activation, pooling and quantization, before looping back to the DRAM loader for write-back to external memory.</desc>

<rect x="0" y="0" width="680" height="740" fill="#ffffff"/>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="75" y="90" width="460" height="590" rx="12" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="85" y="112" font-size="14" font-weight="500" fill="#444441">Top module controller</text>

<rect x="210" y="40" width="200" height="36" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="310" y="63" font-size="14" fill="#2C2C2A" text-anchor="middle">External DRAM</text>

<line x1="330" y1="76" x2="330" y2="130" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="390" y1="130" x2="390" y2="76" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<text x="338" y="107" font-size="12" fill="#444441">in</text>
<text x="398" y="107" font-size="12" fill="#444441">out</text>

<rect x="210" y="130" width="200" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="310" y="157" font-size="14" font-weight="500" fill="#04342C" text-anchor="middle">DRAM loader</text>

<path d="M310,174 L310,198 L200,198 L200,220" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M310,174 L310,198 L420,198 L420,220" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="120" y="220" width="160" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="200" y="247" font-size="14" font-weight="500" fill="#04342C" text-anchor="middle">Activation SRAM</text>

<rect x="340" y="220" width="160" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="420" y="247" font-size="14" font-weight="500" fill="#04342C" text-anchor="middle">Weights SRAM</text>

<path d="M200,264 L200,285 L310,285 L310,310" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M420,264 L420,285 L310,285 L310,310" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="210" y="310" width="200" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="310" y="337" font-size="14" font-weight="500" fill="#26215C" text-anchor="middle">Systolic controller</text>

<line x1="310" y1="354" x2="310" y2="400" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<text x="325" y="384" font-size="12" fill="#444441">A_FEED / B_FEED</text>

<rect x="210" y="400" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="310" y="423" font-size="14" font-weight="500" fill="#26215C" text-anchor="middle">Systolic array</text>
<text x="310" y="443" font-size="12" fill="#534AB7" text-anchor="middle">MAC processing grid</text>

<line x1="310" y1="456" x2="310" y2="506" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<text x="325" y="485" font-size="12" fill="#444441">ACC_OUT (32-bit)</text>

<rect x="210" y="506" width="200" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="310" y="533" font-size="14" font-weight="500" fill="#4A1B0C" text-anchor="middle">SIMD gearbox</text>

<line x1="310" y1="550" x2="310" y2="600" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<text x="325" y="579" font-size="12" fill="#444441">PIX_OUT</text>

<rect x="210" y="600" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="310" y="623" font-size="14" font-weight="500" fill="#4A1B0C" text-anchor="middle">SIMD vector unit</text>
<text x="310" y="643" font-size="12" fill="#993C1D" text-anchor="middle">ReLU, pool, softmax</text>

<rect x="555" y="610" width="80" height="36" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="595" y="633" font-size="14" fill="#2C2C2A" text-anchor="middle">Opcode</text>
<line x1="555" y1="628" x2="410" y2="628" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<path d="M210,628 L100,628 L100,152 L210,152" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<rect x="90" y="690" width="10" height="10" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="106" y="699" font-size="12" fill="#444441">Memory</text>
<rect x="200" y="690" width="10" height="10" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="216" y="699" font-size="12" fill="#444441">Compute</text>
<rect x="320" y="690" width="10" height="10" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="336" y="699" font-size="12" fill="#444441">Vector unit</text>
<rect x="440" y="690" width="10" height="10" rx="2" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="456" y="699" font-size="12" fill="#444441">External I/O</text>
</svg>
